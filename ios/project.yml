name: RGM
options:
  bundleIdPrefix: com.alexwan
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  RGM:
    type: application
    platform: iOS
    sources:
      - path: RGM
    settings:
      base:
        PRODUCT_NAME: "RGM"
        PRODUCT_BUNDLE_IDENTIFIER: com.alexwan.rgmapp
        INFOPLIST_FILE: RGM/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
